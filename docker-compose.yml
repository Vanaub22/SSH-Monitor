name: ssh-monitor

services:
  monitor:
    build:
      context: .
    init: true
    read_only: true
    restart: unless-stopped
    ports:
      - "${SSH_MONITOR_PUBLIC_PORT:-8080}:8080"
    environment:
      SSH_MONITOR_SOURCE: "${SSH_MONITOR_SOURCE:-demo}"
      SSH_MONITOR_LOG_FILE: /logs/ssh.log
      SSH_MONITOR_HOST: 0.0.0.0
      SSH_MONITOR_PORT: 8080
      SSH_MONITOR_ALERT_THRESHOLD: "${SSH_MONITOR_ALERT_THRESHOLD:-10}"
      SSH_MONITOR_WINDOW_SECONDS: "${SSH_MONITOR_WINDOW_SECONDS:-60}"
      SSH_MONITOR_IGNORE_EXISTING: "${SSH_MONITOR_IGNORE_EXISTING:-false}"
    volumes:
      - type: bind
        source: "${SSH_MONITOR_LOG_PATH:-./data/ssh.log}"
        target: /logs/ssh.log
        read_only: true
